aid: feldenergy
name: feld.energy
description: 'feld.energy (Feld.Energy GmbH) is a Freising, Germany based Agri-PV (agrivoltaics)
  project developer and investment company that helps farmers and landowners install
  turnkey agricultural photovoltaic systems on their fields. It combines expertise
  from agriculture, energy, and project development to co-locate crop or livestock
  production with solar generation, offering landowners lease income, revenue sharing,
  or full-ownership models with state-secured grid feed-in over roughly 20 years.
  The company handles every step from land assessment and permitting through
  construction and operation. It reports 800+ partner farmers, 900+ hectares of
  projects, and 320+ MW of secured grid capacity. It is a portfolio company of
  HV Capital and is in the API Evangelist network as a climate-energy company profile;
  it publishes no public developer API, portal, SDK, or machine-readable interface.'
